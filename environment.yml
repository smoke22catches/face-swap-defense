name: face-swap-defense
channels:
  - pytorch
  - conda-forge
dependencies:
  - python>=3.10
  - numpy
  - pip
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu124
    - torch
    - torchvision
    - dotenv
    - gdown
    - torchmetrics
    # Differentiable JPEG (mlomnitz); packaged in-repo — run `conda env create` from this repo root
    - -e ./vendor/DiffJPEG
  - wandb
  - tqdm
  - ipykernel
  - opencv